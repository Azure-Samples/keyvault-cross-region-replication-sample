name: CI — Deploy, Test, and Teardown

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write   # Required for OIDC federated identity
  contents: read

env:
  LOCATION:        westeurope
  TARGET_LOCATION: swedencentral

jobs:
  # ── 1. Deploy test environment ──────────────────────────────────────────────
  deploy:
    name: Deploy test environment
    runs-on: ubuntu-latest
    outputs:
      resource-group: ${{ steps.deploy.outputs.resource-group }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Azure login (OIDC)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure Functions Core Tools
        run: npm install -g azure-functions-core-tools@4 --unsafe-perm true

      - name: Deploy test environment
        id: deploy
        shell: pwsh
        run: |
          $rg = "rg-kvrep-ci-${{ github.run_id }}"
          .\Tests\Deploy-TestEnvironment.ps1 `
            -ResourceGroupName $rg `
            -Location          $env:LOCATION `
            -TargetLocation    $env:TARGET_LOCATION `
            -Force
          echo "resource-group=$rg" >> $env:GITHUB_OUTPUT

      - name: Upload tests.env.json
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-env
          path: Tests/tests.env.json
          retention-days: 1

  # ── 2. Run Pester tests ─────────────────────────────────────────────────────
  test:
    name: Run Pester tests
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Azure login (OIDC)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Download tests.env.json
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: test-env
          path: Tests/

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.0 -Force -Scope CurrentUser

      - name: Run tests
        shell: pwsh
        run: |
          $result = Invoke-Pester Tests\Test-Replication.Tests.ps1 -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) {
            Write-Error "$($result.FailedCount) test(s) failed."
            exit 1
          }

  # ── 3. Teardown — always runs ───────────────────────────────────────────────
  teardown:
    name: Teardown test environment
    runs-on: ubuntu-latest
    needs: [ deploy, test ]
    if: always()

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Azure login (OIDC)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Delete test resource group
        shell: pwsh
        run: |
          $rg = "${{ needs.deploy.outputs.resource-group }}"
          if ($rg) {
            Write-Host "Deleting resource group: $rg"
            az group delete --name $rg --yes --no-wait
          }
